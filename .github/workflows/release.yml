name: Release

# Builds a native Windows DLL and publishes it as a GitHub Release whenever a version tag
# (e.g. v0.1.1) is pushed. Nexus checks this repo's releases for updates (see the `provider`
# and `update_link` fields in src/lib.rs) - it looks at every release's tag name (expects
# "vX.Y.Z", matching Cargo.toml's version), skips anything marked as a pre-release, and picks
# the first ".dll" file it finds attached to the newest one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/gw2_pull_countdown_plugin.dll
          prerelease: false
          generate_release_notes: true
